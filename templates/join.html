<!-- As usual, the AI helped me with the UI -->
{% extends "base.html" %}

{% block title %}
  Join
{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/join.css')}}">
{% endblock %}

{% block content %}
<main class="join-page">
  <div class="join-card">

    <div class="join-section">
      <form class="join-form" action="join" method="POST">
        <div class="input-row">
          <input type="text" name="room_sequence" placeholder="Room code" autocomplete="off" required>
          <button type="submit" class="btn-join">{{ t.join.join }}</button>
        </div>
      </form>
    </div>

    <div class="join-divider"></div>

    <div class="join-section centered">
      <form action="create_room" method="POST">
        <button type="submit" class="btn-create">{{ t.join.create_room }}</button>
      </form>
    </div>

  </div>
</main>
{% endblock %}
