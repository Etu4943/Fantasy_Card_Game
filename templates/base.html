<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset="UTF-8">
		<title>
			{% block title %}
			{% endblock %}
		</title>
		{% block head %}
		{% endblock %}
		<link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css')}}">
	</head>
	<body>
		<header>
			<nav class="navbar">
			    <a href="/" class="nav-logo">
			      <span class="nav-logo-dot"></span>
			      Fantasy
			    </a>

			    <ul class="nav-links">
			      <li><a href="/messages" class="nav-link active">Messages</a></li>
			      <li><a href="/partie" class="nav-link">Game</a></li>
			      <li><a href="/rejoindre" class="nav-link">Join</a></li>
			    </ul>
			    <div class="nav-right">
			    	{% if session['user_id'] %}
				    	<span class="nav-username">{{ session['username'] }}</span>
				    	<a href="/logout" class="nav-btn">Logout</a>
				    {% else %}
				    	<a href="/login" class="nav-btn">Login</a>
				    {% endif %}
			    </div>
			    
			    
			  </nav>
		</header>
		<content>
			{% block content %}
			{% endblock %}
		</content>
		
	</body>
</html>
