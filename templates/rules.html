{% extends "base.html" %}

{% block title %}
	Rules
{% endblock %}

{% block head %}
	<link rel="stylesheet" href="{{ url_for('static', filename='CSS/rules.css') }}">
{% endblock %}

{% block content %}
<main class="rules-page">
	<div class="rules-wrap">

		<h2 class="rules-title">Règles</h2>

		<div class="rules-scroll">
			<table class="rules-table">
				<thead>
					<tr>
						<th>Carte</th>
						<th>Pouvoir</th>
					</tr>
				</thead>
				<tbody>
					{% for card in CARDS %}
					{% set name = card[0] %}
					<tr>
						<td>
							<div class="rule-card-img" role="img" aria-label="{{ name }}" style="background-image: url('{{ url_for('static', filename='Assets/Cards/' + name + '.png') }}');"></div>
						</td>
						<td>{{ t.abilities[name] }}</td>
					</tr>
					{% else %}
					<tr>
						<td colspan="2">Aucune carte à afficher.</td>
					</tr>
					{% endfor %}
				</tbody>
			</table>
		</div>

	</div>
</main>
{% endblock %}
